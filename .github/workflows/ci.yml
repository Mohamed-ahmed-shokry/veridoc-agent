name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tracked whitespace
        shell: bash
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Reject merge-conflict markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "Merge-conflict markers found."
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.9.13"

      - name: Synchronize locked environment
        run: uv sync --all-groups --locked

      - name: Validate lockfile
        run: uv lock --check

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy

      - name: Test with branch coverage
        run: uv run pytest --cov=veridoc

      - name: Build distributions
        run: uv build --clear

      - name: Validate distribution metadata
        run: uv run twine check dist/*

      - name: Validate distribution contents
        run: uv run python scripts/check_distribution.py

      - name: Smoke-test the isolated wheel
        shell: bash
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          uv run --isolated --no-project --no-cache --with "$wheel_path" \
            python scripts/smoke_distribution.py

      - name: Smoke-test the isolated source distribution
        shell: bash
        run: |
          sdist_path="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$sdist_path"
          uv run --isolated --no-project --no-cache --with "$sdist_path" \
            python scripts/smoke_distribution.py
