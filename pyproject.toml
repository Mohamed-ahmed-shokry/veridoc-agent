[project]
name = "veridoc"
version = "0.1.0"
description = "Invoice and purchase-order verification service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.10",
    "openai>=2.52.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
veridoc = "veridoc.__main__:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "twine>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/veridoc"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fitz", "pytesseract", "pytesseract.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["veridoc"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
