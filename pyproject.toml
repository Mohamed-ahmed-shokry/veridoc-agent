[project]
name = "veridoc"
version = "0.1.0"
description = "Invoice and purchase-order verification service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
veridoc = "veridoc.__main__:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
